name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install black==24.3.0 ruff==0.4.4

      - name: Run Black
        run: black --check .

      - name: Run Ruff
        run: ruff check --isolated .

      - name: Run tests
        run: pytest -q
